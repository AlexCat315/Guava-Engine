<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuavaUI DevTools</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="toolbar">
      <div class="brand">
        <strong>GuavaUI DevTools</strong>
        <span id="status" class="status disconnected">Disconnected</span>
      </div>
      <label class="endpoint">
        <span>Endpoint</span>
        <input id="endpoint" value="ws://127.0.0.1:9229/" spellcheck="false">
      </label>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </header>

    <section class="workspace">
      <aside class="treePane">
        <div class="paneHeader">
          <span>Tree <span id="treeCount" class="panelStatus"></span></span>
          <button id="refreshTree" disabled>Refresh</button>
        </div>
        <div class="filterBar">
          <input id="treeSearch" type="search" placeholder="Filter nodes…" autocomplete="off">
        </div>
        <div id="tree" class="tree empty">Connect to a GuavaUI app to inspect the live node tree.</div>
      </aside>

      <section class="mainPane">
        <div class="mirrorHeader">
          <span>Mirror <span id="mirrorStatus" class="panelStatus">Idle</span></span>
          <div class="mirrorControls">
            <label>FPS <input id="mirrorFPS" type="number" min="1" max="60" value="15"></label>
            <label>Quality <input id="mirrorQuality" type="number" min="0.1" max="1" step="0.05" value="0.75"></label>
            <button id="startMirror" disabled>Start</button>
            <button id="stopMirror" disabled>Stop</button>
          </div>
        </div>
        <div id="mirror" class="mirror" tabindex="0">
          <div id="mirrorState" class="empty">No mirror frame. Click Start after connecting.</div>
          <img id="mirrorImage" alt="GuavaUI mirror frame">
        </div>
      </section>

      <aside class="detailsPane">
        <div class="paneHeader">
          <span>Selection</span>
        </div>
        <pre id="details" class="details empty">Select a node in the tree.</pre>
        <div class="paneHeader">
          <span>Runtime</span>
        </div>
        <pre id="runtime" class="details empty">No tree snapshot.</pre>
        <div class="paneHeader">
          <span>Timing</span>
        </div>
        <pre id="timing" class="details empty">No timing sample.</pre>
        <div class="paneHeader">
          <span>State checkpoint</span>
          <div>
            <button id="captureState" disabled>Capture</button>
            <button id="restoreState" disabled>Restore</button>
          </div>
        </div>
        <textarea id="stateSnapshot" class="stateSnapshot" spellcheck="false" placeholder="Captured host state appears here."></textarea>
      </aside>
    </section>

    <section class="bottomPane">
      <div class="paneHeader">
        <span>Log <span id="logCount" class="panelStatus"></span></span>
        <div class="logControls">
          <select id="logLevel">
            <option value="trace">Trace+</option>
            <option value="debug">Debug+</option>
            <option value="info" selected>Info+</option>
            <option value="notice">Notice+</option>
            <option value="warning">Warning+</option>
            <option value="error">Error+</option>
          </select>
          <input id="logSearch" type="search" placeholder="Filter logs…" autocomplete="off">
          <button id="clearLog">Clear</button>
        </div>
      </div>
      <div id="log" class="log empty">No log entries.</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
