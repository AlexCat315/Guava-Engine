name: GuavaEngine CI

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'
      - '.github/workflows/ci-engine.yml'
  pull_request:
    paths:
      - 'Engine/**'
      - '.github/workflows/ci-engine.yml'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    # Linux/Windows are newly added. Keep them non-blocking until the native
    # build + pure-Swift portability is green on those platforms; macOS stays
    # the required check so nothing currently-green can regress.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-15
            experimental: false
          - name: Linux
            runs-on: ubuntu-latest
            experimental: true
          - name: Windows
            # Pinned: windows-latest now resolves to windows-2025-vs2026, whose
            # MSVC (VS 18) intermittently ICEs compiling plutovg.
            runs-on: windows-2025
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # macOS ships Swift with Xcode; Linux/Windows install the toolchain.
      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Set up Swift
        if: runner.os != 'macOS'
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.2"

      - name: Swift version
        shell: bash
        run: swift --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Native C/C++ deps build the same way everywhere — CMake is
      # cross-platform; only the Swift toolchain setup differs above.
      # `--config Release` is required by multi-config generators (Visual Studio
      # on Windows ignores CMAKE_BUILD_TYPE and would otherwise build Debug).
      # `stage_sdl3` is a top-level ALL target that builds the subdirectory
      # SDL3-static target — the VS generator cannot build `--target SDL3-static`
      # directly (MSB1009).
      - name: Build native deps via CMake (SDL3 + Imath + OpenEXR + Jolt)
        shell: bash
        run: |
          # Mirror bootstrap.py exactly: a blanket build (ALL) first builds every
          # bundled lib (all webp variants, plutovg, lunasvg, jolt, ocio/openexr,
          # SDL3 via stage_sdl3 ALL) so the install step finds them; stage_sdl3 /
          # stage_image_decode then stage the bundles; --prefix keeps stray
          # install() rules out of the unwritable system /usr/local.
          cmake -S Engine/third-party -B Engine/build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build Engine/build/native --parallel --config Release
          cmake --build Engine/build/native --parallel --config Release --target stage_sdl3
          cmake --build Engine/build/native --parallel --config Release --target stage_image_decode
          cmake --install Engine/build/native --config Release --prefix "$RUNNER_TEMP/guava-native-install"

      - name: Resolve packages
        shell: bash
        working-directory: Engine
        run: swift package resolve

      - name: Build pure-Swift targets
        shell: bash
        working-directory: Engine
        run: |
          swift build --target EngineKernel
          swift build --target EngineMath
          swift build --target ObservationBus
          swift build --target SceneRuntime
          swift build --target AssetPipeline
          swift build --target SequenceRuntime
          swift build --target CardBattleRuntime
          swift build --target AIRuntime
          swift build --target PluginRuntime
          swift build --target IntentRuntime
          swift build --target ScriptRuntime
          # AudioRuntime pulls CSDL3; on Linux/Windows this compiles the SDL3
          # audio backend, on macOS the AVFoundation one.
          swift build --target AudioRuntime

      - name: Run tests
        shell: bash
        working-directory: Engine
        # Run the package as a whole so every current and future test target is
        # exercised. Real GPU and host Vision smoke cases remain opt-in via
        # GUAVA_RUN_GPU_SMOKE_TESTS / GUAVA_RUN_VISION_SMOKE_TESTS and are
        # skipped on ordinary CI runners.
        run: swift test

      - name: Run M7 destruction performance gates
        if: runner.os == 'macOS'
        shell: bash
        working-directory: Engine
        run: |
          GUAVA_PHYSICS_SCENARIO=destruction-fragments \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
          GUAVA_PHYSICS_SCENARIO=destruction-islands \
          GUAVA_PHYSICS_BODIES=4096 \
          GUAVA_PHYSICS_WARMUP_FRAMES=30 \
          GUAVA_PHYSICS_SAMPLE_FRAMES=120 \
          swift run -c release PhysicsRuntimeBenchmarks
