name: guava-mcp CI

on:
  push:
    branches: [main]
    paths:
      - 'guava-mcp/**'
      - '.github/workflows/ci-guava-mcp.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'
  pull_request:
    paths:
      - 'guava-mcp/**'
      - '.github/workflows/ci-guava-mcp.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'

# guava-mcp is pure Swift with no native dependencies, so it builds on every
# platform Swift supports. Compile it on all three to keep the per-OS socket
# code (#if os(Windows) / Glibc / Darwin) honest — a macOS-only job let a
# Windows-only compile break slip through unnoticed.
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-26
          - name: Linux
            runs-on: ubuntu-latest
          - name: Windows
            runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Swift version
        run: swift --version

      - name: Build (release)
        working-directory: guava-mcp
        run: swift build -c release
