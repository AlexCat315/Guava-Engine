name: GuavaEditor CI

on:
  push:
    branches: [main]
    paths:
      - 'Editor/**'
      - 'Engine/**'
      - 'GuavaUI/**'
      - '.github/workflows/ci-editor.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'
  pull_request:
    paths:
      - 'Editor/**'
      - 'Engine/**'
      - 'GuavaUI/**'
      - '.github/workflows/ci-editor.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-26
          - name: Linux
            runs-on: ubuntu-latest
          - name: Windows
            runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
            libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev libsndio-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            mesa-common-dev ninja-build

      - name: Set up build toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Build native dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: python3 bootstrap.py --force

      - name: Build native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python bootstrap.py --force

      - name: Resolve packages
        shell: bash
        working-directory: Editor
        run: swift package resolve

      - name: Build Editor and Player
        shell: bash
        working-directory: Editor
        run: |
          swift build --product EditorApp
          swift build --product GuavaPlayer

      - name: Run tests
        shell: bash
        working-directory: Editor
        # Run the package as a whole so GameRuntimeTests and any future test
        # targets cannot be added without being exercised by CI.
        run: swift test
