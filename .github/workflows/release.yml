name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish assets to
        required: true
        default: v0.0.5
      target:
        description: Commit SHA or branch to use when creating a missing release
        required: false
        default: main

permissions:
  contents: write

env:
  GUAVA_SWIFT_VERSION: "6.3.2"

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.pin.outputs.target }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            # The release tag is the immutable source of truth. target_commitish
            # is commonly a branch name and may advance before runners start.
            target="$tag"
          else
            tag="${{ inputs.tag }}"
            target="${{ inputs.target }}"
          fi

          if [ -z "$tag" ]; then
            echo "release tag is required" >&2
            exit 1
          fi

          if [ -z "$target" ]; then
            target="${GITHUB_SHA}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.target }}
          fetch-depth: 0

      - name: Pin release source commit
        id: pin
        shell: bash
        run: echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          target="${{ steps.release.outputs.target }}"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "Release $tag was created by the triggering event; skipping re-creation."
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" \
              --target "$target" \
              --title "$tag" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build-editor-macos:
    name: Editor macOS
    needs: prepare-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target }}
          submodules: recursive

      - name: Select Xcode
        shell: bash
        run: |
          for xcode in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app
          do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.GUAVA_SWIFT_VERSION }}

      - name: Verify Swift version
        shell: bash
        run: |
          actual="$(swift --version | head -n 1)"
          echo "$actual"
          if [[ "$actual" != *"Swift version ${GUAVA_SWIFT_VERSION} "* ]]; then
            echo "Expected Swift ${GUAVA_SWIFT_VERSION}; selected toolchain was: $actual" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native dependencies
        run: python3 bootstrap.py --force

      - name: Build Editor, Player, and MCP
        shell: bash
        run: |
          swift build -c release --package-path Editor --product EditorApp
          swift build -c release --package-path Editor --product GuavaPlayer
          swift build -c release --package-path Engine --product GuavaPluginHost
          swift build -c release --package-path guava-mcp

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          editor_bin="$(swift build -c release --package-path Editor --product EditorApp --show-bin-path)"
          player_bin="$(swift build -c release --package-path Editor --product GuavaPlayer --show-bin-path)"
          plugin_host_bin="$(swift build -c release --package-path Engine --product GuavaPluginHost --show-bin-path)"
          mcp_bin="$(swift build -c release --package-path guava-mcp --show-bin-path)"

          dist_root="$PWD/dist"
          package_dir="$dist_root/GuavaEditor-macos-$arch"
          app_dir="$package_dir/GuavaEditor.app"
          rm -rf "$dist_root"
          mkdir -p "$app_dir/Contents/MacOS" \
            "$app_dir/Contents/Helpers" \
            "$app_dir/Contents/Resources"

          cp "$editor_bin/EditorApp" "$app_dir/Contents/MacOS/"
          cp "$player_bin/GuavaPlayer" "$app_dir/Contents/MacOS/"
          cp "$plugin_host_bin/GuavaPluginHost" "$app_dir/Contents/Helpers/"
          cp "$mcp_bin/GuavaMCP" "$app_dir/Contents/Helpers/"
          cp "$plugin_host_bin/libwasmtime.dylib" "$app_dir/Contents/Helpers/"

          find "$editor_bin" -maxdepth 1 -type d \( -name "*.bundle" -o -name "*.resources" \) \
            -exec cp -R {} "$app_dir/Contents/Resources/" \;

          cat > "$app_dir/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Guava Editor</string>
            <key>CFBundleExecutable</key><string>EditorApp</string>
            <key>CFBundleIdentifier</key><string>com.guava.editor</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Guava Editor</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.1</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          bundle_version="${{ needs.prepare-release.outputs.tag }}"
          bundle_version="${bundle_version#v}"
          if [[ "$bundle_version" =~ ^([0-9]+\.[0-9]+(\.[0-9]+)?)([-+].*)?$ ]]; then
            bundle_version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be vMAJOR.MINOR or vMAJOR.MINOR.PATCH for macOS packaging: $bundle_version" >&2
            exit 1
          fi
          plutil -replace CFBundleShortVersionString -string "$bundle_version" "$app_dir/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$app_dir/Contents/Info.plist"
          plutil -lint "$app_dir/Contents/Info.plist"

          "$app_dir/Contents/MacOS/EditorApp" --validate-install
          "$app_dir/Contents/MacOS/GuavaPlayer" --validate-install
          "$app_dir/Contents/Helpers/GuavaPluginHost" </dev/null
          "$app_dir/Contents/Helpers/GuavaMCP" </dev/null
          codesign --force --deep --sign - --timestamp=none "$app_dir"
          codesign --verify --deep --strict "$app_dir"

          zip_path="$dist_root/guava-editor-macos-$arch.zip"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "$zip_path"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "${{ steps.package.outputs.zip_path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-editor-windows:
    name: Editor Windows
    needs: prepare-release
    # Pinned: windows-latest now resolves to windows-2025-vs2026, whose MSVC
    # (VS 18) intermittently ICEs compiling plutovg (CL.exe 0xE06D7363).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target }}
          submodules: recursive

      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.GUAVA_SWIFT_VERSION }}

      - name: Show toolchain
        shell: pwsh
        run: |
          swift --version
          cmake --version

      - name: Verify Swift version
        shell: pwsh
        run: |
          $actual = (swift --version | Select-Object -First 1)
          if ($actual -notlike "*Swift version $env:GUAVA_SWIFT_VERSION *") {
            Write-Error "Expected Swift $env:GUAVA_SWIFT_VERSION; selected toolchain was: $actual"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native dependencies
        shell: pwsh
        run: python bootstrap.py --force

      - name: Build Editor, Player, and MCP
        shell: pwsh
        run: |
          swift build -c release --package-path Editor --product EditorApp
          swift build -c release --package-path Editor --product GuavaPlayer
          swift build -c release --package-path Engine --product GuavaPluginHost
          swift build -c release --package-path guava-mcp

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $editorBin = (swift build -c release --package-path Editor --product EditorApp --show-bin-path).Trim()
          $playerBin = (swift build -c release --package-path Editor --product GuavaPlayer --show-bin-path).Trim()
          $pluginHostBin = (swift build -c release --package-path Engine --product GuavaPluginHost --show-bin-path).Trim()
          $mcpBin = (swift build -c release --package-path guava-mcp --show-bin-path).Trim()

          $distRoot = Join-Path $PWD "dist"
          $packageDir = Join-Path $distRoot "GuavaEditor-windows-x86_64"
          if (Test-Path $distRoot) {
            Remove-Item $distRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $packageDir "Tools") -Force | Out-Null

          Copy-Item (Join-Path $editorBin "EditorApp.exe") $packageDir
          Copy-Item (Join-Path $playerBin "GuavaPlayer.exe") $packageDir
          Copy-Item (Join-Path $pluginHostBin "GuavaPluginHost.exe") (Join-Path $packageDir "Tools")
          Copy-Item (Join-Path $mcpBin "GuavaMCP.exe") (Join-Path $packageDir "Tools")

          Get-ChildItem $editorBin -Directory |
            Where-Object { $_.Name -like "*.bundle" -or $_.Name -like "*.resources" } |
            ForEach-Object { Copy-Item $_.FullName $packageDir -Recurse }

          foreach ($bin in @($editorBin, $playerBin, $pluginHostBin, $mcpBin)) {
            Get-ChildItem $bin -File -Filter "*.dll" |
              ForEach-Object { Copy-Item $_.FullName $packageDir -Force }
          }

          $swiftBin = Split-Path (Get-Command swift.exe).Source
          Get-ChildItem $swiftBin -File -Filter "*.dll" |
            Where-Object { $_.Name -match "^(swift|BlocksRuntime|dispatch|Foundation|FoundationXML|XCTest|icu|libxml2|curl|zlib)" } |
            ForEach-Object { Copy-Item $_.FullName $packageDir -Force -ErrorAction SilentlyContinue }

          # Windows resolves DLLs beside each executable. Helpers live one
          # directory below the main runtime, so give them the same dependency
          # closure instead of relying on the build runner's PATH.
          Get-ChildItem $packageDir -File -Filter "*.dll" |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $packageDir "Tools") -Force }

          & (Join-Path $packageDir "EditorApp.exe") --validate-install
          if ($LASTEXITCODE -ne 0) { throw "Packaged EditorApp validation failed" }
          & (Join-Path $packageDir "GuavaPlayer.exe") --validate-install
          if ($LASTEXITCODE -ne 0) { throw "Packaged GuavaPlayer validation failed" }

          $emptyInput = New-TemporaryFile
          try {
            foreach ($helper in @("GuavaPluginHost.exe", "GuavaMCP.exe")) {
              $helperPath = Join-Path (Join-Path $packageDir "Tools") $helper
              $process = Start-Process -FilePath $helperPath -RedirectStandardInput $emptyInput.FullName -NoNewWindow -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                throw "Packaged $helper startup failed with exit code $($process.ExitCode)"
              }
            }
          } finally {
            Remove-Item $emptyInput -Force
          }

          $zipPath = Join-Path $distRoot "guava-editor-windows-x86_64.zip"
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -Force
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload
        shell: pwsh
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "${{ steps.package.outputs.zip_path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-editor-linux:
    name: Editor Linux
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target }}
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libdbus-1-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsndio-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            mesa-common-dev \
            ninja-build \
            patchelf

      - name: Install Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ env.GUAVA_SWIFT_VERSION }}

      - name: Show toolchain
        shell: bash
        run: |
          swift --version
          cmake --version

      - name: Verify Swift version
        shell: bash
        run: |
          actual="$(swift --version | head -n 1)"
          if [[ "$actual" != *"Swift version ${GUAVA_SWIFT_VERSION} "* ]]; then
            echo "Expected Swift ${GUAVA_SWIFT_VERSION}; selected toolchain was: $actual" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native dependencies
        shell: bash
        run: python3 bootstrap.py --force

      - name: Build Editor, Player, and MCP
        shell: bash
        run: |
          swift build -c release --package-path Editor --product EditorApp
          swift build -c release --package-path Editor --product GuavaPlayer
          swift build -c release --package-path Engine --product GuavaPluginHost
          swift build -c release --package-path guava-mcp

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          editor_bin="$(swift build -c release --package-path Editor --product EditorApp --show-bin-path)"
          player_bin="$(swift build -c release --package-path Editor --product GuavaPlayer --show-bin-path)"
          plugin_host_bin="$(swift build -c release --package-path Engine --product GuavaPluginHost --show-bin-path)"
          mcp_bin="$(swift build -c release --package-path guava-mcp --show-bin-path)"

          dist_root="$PWD/dist"
          package_dir="$dist_root/GuavaEditor-linux-x86_64"
          rm -rf "$dist_root"
          mkdir -p "$package_dir/Tools" "$package_dir/Lib"

          cp "$editor_bin/EditorApp" "$package_dir/"
          cp "$player_bin/GuavaPlayer" "$package_dir/"
          cp "$plugin_host_bin/GuavaPluginHost" "$package_dir/Tools/"
          cp "$mcp_bin/GuavaMCP" "$package_dir/Tools/"

          find "$editor_bin" -maxdepth 1 -type d \( -name "*.bundle" -o -name "*.resources" \) \
            -exec cp -R {} "$package_dir/" \;

          ldd "$package_dir/EditorApp" "$package_dir/GuavaPlayer" \
            "$package_dir/Tools/GuavaPluginHost" "$package_dir/Tools/GuavaMCP" \
            | awk '/=> \// { print $3 } /^\// { print $1 }' \
            | sort -u \
            | { grep -E '/swift-|/usr/lib/swift|/swift/linux|libswift|libFoundation|libdispatch|libBlocksRuntime|lib_Foundation|libicu' || true; } \
            | while read -r lib; do
                if [ -f "$lib" ]; then
                  cp -L "$lib" "$package_dir/Lib/"
                fi
              done

          patchelf --set-rpath '$ORIGIN/Lib:$ORIGIN' "$package_dir/EditorApp"
          patchelf --set-rpath '$ORIGIN/Lib:$ORIGIN' "$package_dir/GuavaPlayer"
          patchelf --set-rpath '$ORIGIN/../Lib:$ORIGIN/..' "$package_dir/Tools/GuavaPluginHost"
          patchelf --set-rpath '$ORIGIN/../Lib:$ORIGIN/..' "$package_dir/Tools/GuavaMCP"

          cat > "$package_dir/run-editor.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          export LD_LIBRARY_PATH="$PWD/Lib:${LD_LIBRARY_PATH:-}"
          exec ./EditorApp "$@"
          EOF
          chmod +x "$package_dir/run-editor.sh"

          if ldd "$package_dir/EditorApp" "$package_dir/GuavaPlayer" \
            "$package_dir/Tools/GuavaPluginHost" "$package_dir/Tools/GuavaMCP" \
            | grep -q 'not found'; then
            echo "Packaged binaries contain unresolved shared libraries" >&2
            ldd "$package_dir/EditorApp" "$package_dir/GuavaPlayer" \
              "$package_dir/Tools/GuavaPluginHost" "$package_dir/Tools/GuavaMCP" >&2
            exit 1
          fi
          "$package_dir/EditorApp" --validate-install
          "$package_dir/GuavaPlayer" --validate-install
          "$package_dir/Tools/GuavaPluginHost" </dev/null
          "$package_dir/Tools/GuavaMCP" </dev/null

          tar_path="$dist_root/guava-editor-linux-x86_64.tar.gz"
          tar -C "$dist_root" -czf "$tar_path" "$(basename "$package_dir")"
          echo "tar_path=$tar_path" >> "$GITHUB_OUTPUT"

      - name: Upload
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "${{ steps.package.outputs.tar_path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
