name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/ci-website.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/ci-website.yml'
      - '.github/actions/setup-toolchains/**'
      - 'bootstrap.py'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: |
          npm install -g npm@12.2.0
          npm ci

      - name: Lint
        run: npm run lint

      # `build` validates documentation content, type-checks the Vue app,
      # runs Vitest, and generates the static site.
      - name: Test and build
        run: npm run build
